name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "firebase-hosting"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore previous feed
        uses: actions/cache@v4
        with:
          path: public/ai-feed.json
          key: ai-feed-${{ github.run_id }}
          restore-keys: ai-feed-

      - name: Refresh publisher feeds
        run: npm run feed:update

      - name: Test feed parsing
        run: npm test

      - name: Build application
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGICMIRROR_205517 }}'
          channelId: live
          projectId: magicmirror-205517
